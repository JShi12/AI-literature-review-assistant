services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: litreview
      POSTGRES_USER: litreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litreview}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litreview -d litreview"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://litreview:${POSTGRES_PASSWORD:-litreview}@db:5432/litreview
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      APP_PASSWORD: ${APP_PASSWORD:-}
      READ_ONLY_DEMO: ${READ_ONLY_DEMO:-}
    ports:
      - "8501:8501"
    volumes:
      # Local development convenience only (live code reload without rebuilding the image).
      # A production image should rely solely on the code baked in by COPY above.
      - ./data:/app/data
      - ./src:/app/src
      - ./alembic:/app/alembic

volumes:
  postgres_data:
